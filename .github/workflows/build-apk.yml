name: Build Dictate APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865'

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch sherpa-onnx native libs
        run: bash tools/fetch-sherpa-onnx.sh

      - name: Create signing key
        run: |
          keytool -genkeypair -v -keystore mantra.jks -alias mantra -keyalg RSA -keysize 2048 -validity 10000 -storepass mantra12345 -keypass mantra12345 -dname "CN=Mantra Productions, O=Mantra, C=HR"
          printf 'storeFile=mantra.jks\nstorePassword=mantra12345\nkeyAlias=mantra\nkeyPassword=mantra12345\n' > keystore.properties

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" dictate-keyboard-build-${{ github.run_number }}.apk
          gh release create "build-${{ github.run_number }}" dictate-keyboard-build-${{ github.run_number }}.apk --title "Dictate APK build ${{ github.run_number }}" --notes "Self built release APK, AssemblyAI ready"
