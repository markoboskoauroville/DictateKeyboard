name: Build Mantra Voice Type APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865'

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch sherpa-onnx native libs
        run: bash tools/fetch-sherpa-onnx.sh

      # One permanent key, kept as an encrypted repository secret. Every build is then signed
      # identically, so a new version installs straight over the old one and Android never asks
      # anyone to uninstall anything. A throwaway key per build was what forced that before.
      - name: Restore the signing key
        env:
          KS: ${{ secrets.VOICE_TYPE_KEYSTORE }}
          KS_PW: ${{ secrets.VOICE_TYPE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ]; then
            echo "No keystore secret found, this build would not be upgradable in place."
            exit 1
          fi
          echo "$KS" | base64 -d > voicetype.jks
          printf 'storeFile=voicetype.jks\nstorePassword=%s\nkeyAlias=voicetype\nkeyPassword=%s\n' "$KS_PW" "$KS_PW" > keystore.properties
          keytool -list -keystore voicetype.jks -storepass "$KS_PW" | grep -i 'SHA-256' || true

      - name: Build release APK
        # The build number the release is named after is passed into the build itself, so About can
        # report the number that is actually on the APK someone downloaded. Previously the app
        # carried a hand-bumped version code that had drifted far from the run number, and reported
        # a build nobody had ever installed.
        run: ./gradlew :app:assembleRelease -x lintVitalRelease --no-daemon -PprojectVersionCode=${{ github.run_number }}

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" mantra-voice-type-build-${{ github.run_number }}.apk
          gh release create "build-${{ github.run_number }}" mantra-voice-type-build-${{ github.run_number }}.apk --title "Mantra Voice Type build ${{ github.run_number }}" --notes "Mantra Voice Type, by Mantra Productions. Installs over the previous build."
